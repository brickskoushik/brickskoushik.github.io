<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College PDF Library</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://tailwindcss.com" defer></script>
    
    <!-- Load Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Phosphor Icons for modern iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .card-hover {
            transition: all 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex flex-col md:flex-row h-screen overflow-hidden">

    <!-- Mobile Header / Top Bar -->
    <div class="md:hidden bg-white shadow-sm w-full p-4 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2 text-brand-600">
            <i class="ph ph-books text-2xl font-bold"></i>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">EduLib</h1>
        </div>
        <button id="mobile-menu-btn" class="text-slate-500 hover:text-slate-700 focus:outline-none">
            <i class="ph ph-list text-2xl"></i>
        </button>
    </div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="bg-white w-full md:w-64 border-r border-slate-200 h-full flex-col hidden md:flex absolute md:relative z-10 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0">
        <div class="p-6 flex items-center gap-2 text-brand-600 hidden md:flex border-b border-slate-100">
            <i class="ph ph-books text-3xl font-bold"></i>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">EduLib</h1>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-3 mt-4 md:mt-0">Categories</h2>
            <nav id="filter-nav" class="space-y-1">
                <!-- Filters will be generated here by JS -->
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <div class="flex items-center gap-3 px-3 py-2">
                <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold">
                    H
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-700">Help Desk</p>
                    <p class="text-xs text-slate-500">Koushik Sadhukhan</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Top Header (Desktop) -->
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex justify-between items-center shrink-0 hidden md:flex">
            <div>
                <h2 id="current-category-title" class="text-xl font-semibold text-slate-800">All Materials</h2>
                <p class="text-sm text-slate-500">Browse and manage your college documents</p>
            </div>
            
            <!-- Optional Search Bar -->
            <div class="relative w-64">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="Search files..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent rounded-lg text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all">
            </div>
        </header>

        <!-- Document Grid Container -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6">
            
            <div class="md:hidden mb-4">
                <h2 id="mobile-category-title" class="text-xl font-semibold text-slate-800">All Materials</h2>
            </div>

            <div id="pdf-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- PDF Cards will be generated here by JS -->
            </div>
            
            <!-- Empty State (Hidden by default) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mb-4">
                    <i class="ph ph-file-dashed text-4xl"></i>
                </div>
                <h3 class="text-lg font-medium text-slate-900">No documents found</h3>
                <p class="text-slate-500 mt-1">Try adjusting your filters or search query.</p>
            </div>
        </div>
    </main>

    <!-- Overlay for mobile sidebar -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-0 hidden md:hidden"></div>

    <script>
        // ============================================================================
        // 📚 EDIT YOUR PDF MATERIALS HERE
        // ============================================================================
        // Replace the links inside the 'link' property with your actual Google Drive,
        // Dropbox, or direct PDF links. 
        // Example: link: 'https://mycollege.edu/files/notes.pdf'
        //
        // You can also add new objects to this array.
        // ============================================================================
        
        const pdfMaterials = [
            {
                title: 'His min pyq 2024',
                category: 'pyq',
                link: './pdfs/HIS-MNC-T-02 (2).pdf'       
            },
            {
                title: 'His min pyq 2025',
                category: 'pyq',
                link: './pdfs/HIS-MNC-T-02.pdf'
            },
            {
                title: 'Geo major pyq 2024',
                category: 'pyq',
                link: './pdfs/GEOG-MJ-T-3.pdf'
            },
            {
                title: 'Geo major pyq 2025',
                category: 'pyq',
                link: './pdfs/GEOG-M-T-3.pdf'
            },
            {
                title: 'Geography Syllabus NEP 2020(3rd sem)',
                category: 'Syllabus',
                link: './pdfs/KU_Geography_UG_Syllabus_NEP_2020_Sem_I_VIII_14_01_2026-FIN (1).pdf'
            },
            {
                title: 'UI-VAC Set 2(2025)',
                category: 'pyq',
                link:'./pdfs/UI-VAC-T-03(SET-2).pdf'
            },
            {
                title: 'UI-VAC 2nd Half(2024)',
                category: 'pyq',
                link: './pdfs/UI-VAC-T-03 2ND HALF.pdf'
            },
            {
                title: 'UI-VAC 1st Half(2024)',
                category: 'pyq',
                link: './pdfs/UI-VAC-T-03 1ST HALF.pdf'
            },
	    {
                title: 'SEC-Gis practical(2025)',
                category: 'pyq',
                link: './pdfs/gis prac pyq 2025.pdf'
            },
	    {
       		 title: 'India Monsoon Practical Link',
       		 category: 'Practical link meterials',
      		  link: 'https://drive.google.com/drive/folders/1jzYirmngqpHgwXm-iMfjZ2E4mquWqZrj'
  	    }

        ];

        // ============================================================================
        // APP LOGIC & RENDERING
        // ============================================================================

        // Extract unique categories from the data
        const categories = ['All', ...new Set(pdfMaterials.map(item => item.category))];
        let currentCategory = 'All';
        let searchQuery = '';

        const gridContainer = document.getElementById('pdf-grid');
        const filterNav = document.getElementById('filter-nav');
        const emptyState = document.getElementById('empty-state');
        const desktopTitle = document.getElementById('current-category-title');
        const mobileTitle = document.getElementById('mobile-category-title');
        const searchInput = document.getElementById('search-input');
        
        // Mobile sidebar logic
        const sidebar = document.getElementById('sidebar');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileOverlay = document.getElementById('mobile-overlay');

        
       // Function to determine icon based on category
        function getCategoryIcon(category) {
            switch(category.toLowerCase()) {
                case 'pyq': return 'ph-file-text'; // PYQ er jonno standard professional icon
                case 'syllabus': return 'ph-book-bookmark'; // Syllabus er jonno bookmark/book icon
                case 'practical link meterials': return 'ph-link-simple'; // Link er jonno professional icon
                case 'projects': return 'ph-lightbulb';
                case 'all': return 'ph-files';
                default: return 'ph-file-pdf';
            }
        }

        // Function to determine badge color based on category
        function getBadgeColor(category) {
            switch(category.toLowerCase()) {
                case 'pyq': return 'bg-blue-100 text-blue-700';
                case 'syllabus': return 'bg-amber-100 text-amber-700';
                case 'practical link meterials': return 'bg-emerald-100 text-emerald-700';
                case 'projects': return 'bg-purple-100 text-purple-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        // Render the sidebar filters
        function renderFilters() {
            filterNav.innerHTML = '';
            categories.forEach(category => {
                const isActive = category === currentCategory;
                const iconClass = getCategoryIcon(category);
                
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    isActive 
                    ? 'bg-brand-50 text-brand-700' 
                    : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                }`;
                btn.innerHTML = `
                    <i class="ph ${iconClass} text-lg ${isActive ? 'text-brand-600' : 'text-slate-400'}"></i>
                    ${category}
                `;
                
                btn.onclick = () => {
                    currentCategory = category;
                    renderFilters(); // Update active states
                    renderGrid();
                    updateTitles();
                    closeMobileMenu();
                };
                
                filterNav.appendChild(btn);
            });
        }

        // Update Header Titles
        function updateTitles() {
            const titleText = currentCategory === 'All' ? 'All Materials' : `${currentCategory}`;
            desktopTitle.textContent = titleText;
            mobileTitle.textContent = titleText;
        }

        // Render the PDF Cards
        function renderGrid() {
            gridContainer.innerHTML = '';
            
            // Filter logic
            const filteredDocs = pdfMaterials.filter(doc => {
                const matchesCategory = currentCategory === 'All' || doc.category === currentCategory;
                const matchesSearch = doc.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      doc.category.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredDocs.length === 0) {
                gridContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                gridContainer.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredDocs.forEach(doc => {
                    const badgeColor = getBadgeColor(doc.category);
                    
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl border border-slate-200 p-5 flex flex-col h-full card-hover group relative overflow-hidden';
                    
                    // Top color accent bar
                    card.innerHTML = `
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-400 to-brand-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 rounded-lg bg-red-50 text-red-500 flex items-center justify-center shrink-0">
                                <i class="ph-fill ph-file-pdf text-2xl"></i>
                            </div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeColor}">
                                ${doc.category}
                            </span>
                        </div>
                        
                        <div class="flex-1">
                            <h3 class="text-base font-semibold text-slate-800 leading-tight mb-2 line-clamp-2" title="${doc.title}">${doc.title}</h3>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-slate-100">
                            <a href="${doc.link}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex justify-center items-center gap-2 px-4 py-2 bg-slate-50 hover:bg-brand-50 text-slate-700 hover:text-brand-700 text-sm font-medium rounded-lg transition-colors border border-slate-200 hover:border-brand-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-1">
                                <span>Open Document</span>
                                <i class="ph ph-arrow-up-right font-bold"></i>
                            </a>
                        </div>
                    `;
                    
                    gridContainer.appendChild(card);
                });
            }
        }

        
        // Search functionality
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        // Mobile Menu Toggle logic
        function toggleMobileMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('hidden'); // allow flex display
                // Small delay to allow display change to register before transition
                setTimeout(() => {
                    sidebar.classList.remove('-translate-x-full');
                    mobileOverlay.classList.remove('hidden');
                }, 10);
            } else {
                closeMobileMenu();
            }
        }

        function closeMobileMenu() {
            if (window.innerWidth < 768) { // Only apply to mobile breakpoint
                sidebar.classList.add('-translate-x-full');
                mobileOverlay.classList.add('hidden');
                // Hide completely after transition ends
                setTimeout(() => {
                    sidebar.classList.add('hidden');
                }, 300);
            }
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        mobileOverlay.addEventListener('click', closeMobileMenu);

        // Handle window resize for mobile menu state
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('hidden', '-translate-x-full');
                mobileOverlay.classList.add('hidden');
            } else {
                sidebar.classList.add('hidden', '-translate-x-full');
            }
        });

        // Initialize App
        renderFilters();
        renderGrid();
        updateTitles();

    </script>
</body>
</html>
